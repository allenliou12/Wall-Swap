[project]
name = "wallswap"
version = "0.1.0"
description = "Windows tray app that rotates 1440p+ wallpapers from Wallhaven, the Met museum and your own folders"
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=12.1.1",
    "pystray>=0.19.5",
    "requests>=2.32.5",
    "winrt-runtime>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-storage>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-system-userprofile>=3.2.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
# Bug-finding rules only (pyflakes + syntax/statement errors); style stays a review call.
select = ["E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
